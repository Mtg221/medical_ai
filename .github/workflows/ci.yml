name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR (EN/FR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Lint with ruff
        run: ruff check medresearch_platform tests
      - name: Type check with mypy
        run: mypy medresearch_platform
      - name: Run pytest with coverage
        run: pytest --cov=medresearch_platform --cov-report=term-missing

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medresearch-platform"
version = "0.1.0"
description = "Research-grade bilingual (EN/FR) medical information extraction platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "psutil>=6.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "starlette>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
medresearch-cli = "medresearch_platform.interfaces.cli:main"
medextract = "medresearch_platform.data.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medresearch_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["extras", "frontend", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
exclude = ["extras/", "frontend/", "var/"]
